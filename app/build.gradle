plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing credentials live in keystore.properties at the repo root.
// Both that file and the .jks are git-ignored: never commit them.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    // PHONEIDE_SIGNING_START
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    // PHONEIDE_SIGNING_END

    namespace 'com.dopavin'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dopavin'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        // Lag fix: a debuggable APK runs Compose and ART far slower (no optimisation, extra checks), and
        // CI / on-device builds ship the debug APK. It is now built non-debuggable so day-to-day use is
        // smooth. Need breakpoints or `run-as`? Build once with:  ./gradlew assembleDebug -PdopavinDebuggable=true
        debug {
            debuggable project.findProperty('dopavinDebuggable') == 'true'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // Lag fix: strong skipping (Compose compiler 1.5.14, same flag the 2.0 compiler turns on by default).
        // Every UI state class here holds List<...>, which Compose treats as unstable, so without this a
        // change anywhere recomposed whole screens. With it, composables whose inputs are the same instances
        // are skipped. No Kotlin / Compose version change is needed.
        freeCompilerArgs += [
            '-P',
            'plugin:androidx.compose.compiler.plugins.kotlin:experimentalStrongSkipping=true',
        ]
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'

    implementation 'androidx.compose.ui:ui:1.7.5'
    implementation 'androidx.compose.foundation:foundation:1.7.5'
    implementation 'androidx.compose.material3:material3:1.3.1'

    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Online playback (owner-approved 2026-10-19, see docs 01). Wrapped InnerTube client.
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'

    // Unit tests for the pure scorer/planner (owner spec §15/§17, approved in F-96). Not used by
    // assembleDebug; resolved only when a *Test task runs.
    testImplementation 'junit:junit:4.13.2'
}
